name: Tests

# Runs the pytest suite on every push/PR. Hermetic unit tests only -- the
# `integration` marker (real network/service calls) is excluded here and
# self-skips anyway when no live endpoint/API key is configured.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -m "not integration"

  # The GUI tier: NiceGUI, pandas and plotly exist only in
  # the ui image, so the job above skips these tests. Run in the image built
  # here, exactly as locally (README "Running Tests").
  gui-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the base and ui images
        run: |
          docker build -f docker/base.Dockerfile -t mcp-docking-base:latest .
          docker build -f Dockerfile.ui -t mcp-docking-ui:latest .

      - name: Run the GUI tier
        run: >
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace
          mcp-docking-ui:latest
          python -m pytest -c ui_nice/pytest.ini
          tests/test_nicegui_*.py tests/test_ui_comparison.py tests/test_ui_results_rendering.py

  # A real dock: the Moldina binary is only in its own image, and
  # the job above mocks it. No network or running service is needed.
  real-docking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the base and moldina-runner images
        run: |
          docker build -f docker/base.Dockerfile -t mcp-docking-base:latest .
          docker build -f docker/moldina_runner.Dockerfile -t mcp-moldina-runner:latest .

      - name: Run a real dock
        run: >
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace -e PYTHONPATH=/workspace
          mcp-moldina-runner:latest
          python -m pytest tests/test_real_docking.py -p no:cacheprovider
