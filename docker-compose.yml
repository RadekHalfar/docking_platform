# Docker Compose configuration for MCP Docking System
# Orchestrates all microservices with proper networking and volumes
#
# Usage:
#   docker-compose up -d          # Start all services in background
#   docker-compose ps             # Check service status
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop all services
#   docker-compose restart        # Restart services

# Base service configuration template
x-service-common: &service-common
  restart: unless-stopped
  networks:
    - mcp-network
  volumes:
    - ./cache:/app/cache
    - ./demo_output:/app/demo_output
    - ./orchestrator_output:/app/orchestrator_output
  environment:
    - PYTHONUNBUFFERED=1

services:
  # RCSB Downloader Service (Port 8001)
  # Downloads protein and ligand structures from RCSB PDB
  rcsb-downloader:
    <<: *service-common
    image: mcp-rcsb-downloader:latest
    build:
      context: .
      dockerfile: docker/rcsb_downloader.Dockerfile
    container_name: mcp-rcsb-downloader
    # Host-side port is configurable via .env (RCSB_DOWNLOADER_PORT) to work
    # around "Address already in use" without touching the container's own
    # port (which the healthcheck below always targets at 8001).
    ports:
      - "127.0.0.1:${RCSB_DOWNLOADER_PORT:-8001}:8001"
    # Lightweight, I/O-bound (network downloads) -- small budget is plenty.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ligand Preparer Service (Port 8002)
  # Prepares ligands for docking (protonation, PDBQT conversion)
  ligand-preparer:
    <<: *service-common
    image: mcp-ligand-preparer:latest
    build:
      context: .
      dockerfile: docker/ligand_preparer.Dockerfile
    container_name: mcp-ligand-preparer
    # See rcsb-downloader above: host port configurable via .env, container
    # port fixed at 8002 to match the healthcheck.
    ports:
      - "127.0.0.1:${LIGAND_PREPARER_PORT:-8002}:8002"
    # RDKit/OpenBabel conversion work -- moderate CPU/memory budget.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Protein Preparer Service (Port 8003)
  # Prepares proteins for docking (clean, add H, PDBQT conversion)
  protein-preparer:
    <<: *service-common
    image: mcp-protein-preparer:latest
    build:
      context: .
      dockerfile: docker/protein_preparer.Dockerfile
    container_name: mcp-protein-preparer
    # See rcsb-downloader above: host port configurable via .env, container
    # port fixed at 8003 to match the healthcheck.
    ports:
      - "127.0.0.1:${PROTEIN_PREPARER_PORT:-8003}:8003"
    # RDKit-based cleanup/protonation work -- moderate CPU/memory budget.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Moldina Runner Service (Port 8004)
  # Executes molecular docking with Moldina/Vina
  moldina-runner:
    <<: *service-common
    image: mcp-moldina-runner:latest
    build:
      context: .
      dockerfile: docker/moldina_runner.Dockerfile
    container_name: mcp-moldina-runner
    # See rcsb-downloader above: host port configurable via .env, container
    # port fixed at 8004 to match the healthcheck.
    ports:
      - "127.0.0.1:${MOLDINA_RUNNER_PORT:-8004}:8004"
    environment:
      - PYTHONUNBUFFERED=1
      - MOLDINA_PATH=/usr/local/bin/moldina
    # Resource limits for compute-intensive docking
    deploy:
      resources:
        limits:
          cpus: '10'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama LLM Service (Port 11434) -- opt-in
  # Local LLM for the chat / natural-language commands. Not part of the
  # default `up -d`: the image (~4.8 GB) and a model (3-5 GB) download only
  # for users who want a local LLM. Start it with
  #   docker compose --profile local-llm up -d ollama
  # then pick "Ollama (local)" in the GUI's Settings, which can download a
  # model. Models persist in the ollama-data volume.
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    container_name: mcp-llm
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - mcp-network
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # GPU support disabled — enable if nvidia-container-toolkit is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Development Script Runner (no venv needed, no rebuild on script edits)
  # Usage:
  #   docker compose --profile dev run --rm script-runner python nlp_orchestrator.py --check-health
  #   docker compose --profile dev run --rm script-runner python nlp_orchestrator.py "Download 6lu7 and ATP, prepare and dock"
  script-runner:
    profiles: ["dev"]
    image: mcp-docking-base:latest
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    container_name: mcp-script-runner
    working_dir: /workspace
    command: ["python", "--version"]
    networks:
      - mcp-network
    # Lets the CLI reach an Ollama app on the host, as ui does (see there).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Kept read-write (unlike ui's otherwise-identical mount below):
      # running `pytest` through this service needs to write .pytest_cache/
      # and tests/test_output at the repo root, and the whole point of this
      # service is editing/running arbitrary scripts without a rebuild. It's
      # opt-in (--profile dev) and never part of the default `up -d` stack.
      - ./:/workspace
      - ./cache:/workspace/cache
      - ./demo_output:/workspace/demo_output
      - ./orchestrator_output:/workspace/orchestrator_output
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_RCSB_DOWNLOADER_URL=http://rcsb-downloader:8001
      - MCP_LIGAND_PREPARER_URL=http://ligand-preparer:8002
      - MCP_PROTEIN_PREPARER_URL=http://protein-preparer:8003
      - MCP_MOLDINA_RUNNER_URL=http://moldina-runner:8004
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    depends_on:
      rcsb-downloader:
        condition: service_healthy
      ligand-preparer:
        condition: service_healthy
      protein-preparer:
        condition: service_healthy
      moldina-runner:
        condition: service_healthy

  # Web GUI (NiceGUI, port 3000). Runs as the non-root appuser
  # (Dockerfile.ui); see docs/DOCKER_DEPLOYMENT.md for the one-time chown
  # Linux hosts need for session files owned by root.
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: mcp-docking-ui:latest
    container_name: mcp-ui
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - mcp-network
    # Lets the GUI reach an Ollama app running on the host itself
    # (http://host.docker.internal:11434); Docker Desktop provides the name,
    # Linux needs this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only: Dockerfile.ui doesn't COPY app source, it runs straight off
      # this mount, but the UI only ever needs to *read* code -- all of its
      # actual writes (uploads, settings, job output) land in the two rw
      # mounts below. Read-only here means a compromised ui container can no
      # longer modify source/Dockerfiles/docker-compose.yml on the host.
      - ./:/workspace:ro
      - ./cache:/workspace/cache
      - ./orchestrator_output:/workspace/orchestrator_output
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - OUTPUT_BASE=/workspace/orchestrator_output
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - DOCKING_PLATFORM_SETTINGS_FILE=/workspace/cache/.docking_platform_settings.json
      - MCP_RCSB_DOWNLOADER_URL=http://rcsb-downloader:8001
      - MCP_LIGAND_PREPARER_URL=http://ligand-preparer:8002
      - MCP_PROTEIN_PREPARER_URL=http://protein-preparer:8003
      - MCP_MOLDINA_RUNNER_URL=http://moldina-runner:8004
    depends_on:
      rcsb-downloader:
        condition: service_healthy
      ligand-preparer:
        condition: service_healthy
      protein-preparer:
        condition: service_healthy
      moldina-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

# Network configuration
networks:
  mcp-network:
    driver: bridge

# Volume configuration
volumes:
  # Ollama model storage
  ollama-data:
    driver: local

  # Output directory for docking results and visualizations
  # Mounted from host for easy access
  # (defined inline in service configs above)
