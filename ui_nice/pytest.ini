# The GUI test tier (Phase 16). NiceGUI and pytest-asyncio exist only in
# the ui image, so this config is separate from the repo's pytest.ini:
#
#   docker compose run --rm --no-deps ui \
#     python -m pytest -c ui_nice/pytest.ini tests/test_nicegui_*.py \
#       tests/test_ui_comparison.py tests/test_ui_results_rendering.py
#
# CI runs the same files in its gui-tier job (.github/workflows/tests.yml).
#
# main_file is resolved relative to this file (NiceGUI's user_plugin).
# tests.nicegui_harness isolates every test (tmp OUTPUT_BASE, fake bridge,
# no network). No cache provider: /workspace is mounted read-only.
[pytest]
asyncio_mode = auto
main_file = app.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require running services or external dependencies
addopts =
    -v
    --tb=short
    --strict-markers
    -p nicegui.testing.user_plugin
    -p tests.nicegui_harness
    -p no:cacheprovider
